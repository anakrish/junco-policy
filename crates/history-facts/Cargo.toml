[package]
name = "history-facts"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
std = ["history-syntax/std", "history-semantics?/std", "history-store?/std", "junco-core?/std"]
runtime = ["dep:history-semantics", "history-semantics/runtime", "dep:history-store", "history-store/runtime", "dep:junco-core"]

[dependencies]
history-syntax = { path = "../history-syntax", default-features = false }
history-semantics = { path = "../history-semantics", default-features = false, optional = true }
history-store = { path = "../history-store", default-features = false, optional = true }
junco-core = { path = "../junco-core", default-features = false, optional = true }

[dev-dependencies]
junco-policy = { path = "../.." }

[[example]]
name = "prior_edit"
required-features = ["runtime", "std"]

[[example]]
name = "locks"
required-features = ["runtime", "std"]

[[example]]
name = "flow"
required-features = ["runtime", "std"]
