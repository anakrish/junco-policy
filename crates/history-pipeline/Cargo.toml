[package]
name = "history-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["std", "runtime"]
std = ["history-syntax/std", "history-semantics?/std", "history-store?/std", "junco-core?/std"]
runtime = ["dep:history-semantics", "dep:history-store", "dep:junco-core"]

[dependencies]
history-syntax = { path = "../history-syntax", default-features = false }
history-semantics = { path = "../history-semantics", default-features = false, features = ["runtime"], optional = true }
history-store = { path = "../history-store", default-features = false, features = ["runtime"], optional = true }
junco-core = { path = "../junco-core", default-features = false, features = ["runtime"], optional = true }

[[example]]
name = "policies"
required-features = ["std", "runtime"]
