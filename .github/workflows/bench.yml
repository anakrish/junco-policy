name: Benchmarks

on:
  push:
    branches: [bench/dogwood-outperforms-junco]
  pull_request:
    branches: [bench/dogwood-outperforms-junco]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('bench-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CRITERION_HOME: ${{ github.workspace }}/criterion

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Test comparison renderer
        run: python3 -B -m unittest discover -s scripts -p test_dogwood_bench_page.py

      - name: Compare decision latency
        run: |
          rustc -Vv
          LC_ALL=C lscpu | grep 'Model name:'
          mkdir "$CRITERION_HOME"
          cargo bench --locked --no-fail-fast --manifest-path fuzz/Cargo.toml --bench refunds --bench binding_churn
          python3 scripts/dogwood_bench_page.py "$CRITERION_HOME"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: criterion

  deploy:
    name: Deploy to GitHub Pages
    needs: bench
    if: github.repository == 'anakrish/junco-policy' && github.ref == 'refs/heads/bench/dogwood-outperforms-junco' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
